name: build

# CI for this branch: the Shrek 2 (UE_GAME_SHREK2) Android APK, built on every push and pull request
# and uploaded as a workflow artifact. The UT2004 native/Windows/web matrix lives on upstream's
# branches; this branch ships the Shrek 2 port only.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shrek2-android:
    name: shrek2-android (APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # JDK 17: the Gradle daemon's (Android/gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Only platform-tools: the action's default list names `tools`, which the current SDK repository
      # (cmdline-tools 16.0) does not have. The NDK and CMake come from the next step.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # The NDK and the CMake the Gradle plugin asks for; the versions match app/build.gradle's
      # ndkVersion, because AGP silently downloads its own on a mismatch. CI writes its own
      # local.properties for this runner's SDK.
      - name: Install the NDK + CMake and point the build at this runner's SDK
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;4.1.2" >/dev/null
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" "$ANDROID_HOME" > Android/local.properties

      - name: Build the APK
        run: ./gradlew -Pshrek2 assembleDebug --console=plain
        working-directory: Android

      # All three ABIs must be in there. A silent drop to one ABI is the failure mode worth catching:
      # the APK still installs, and only fails on the device you did not test.
      - name: Assert every ABI is packaged
        run: |
          set -euo pipefail
          apk=Android/app/build/outputs/apk/debug/app-debug.apk
          for abi in armeabi-v7a arm64-v8a; do
            unzip -l "$apk" | grep -q "lib/$abi/libUT2004.so" || { echo "::error::missing $abi"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: shrek2-android
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
